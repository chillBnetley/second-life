name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试 / 不变量
        run: npm test
      - name: 无头模拟（1000 天）
        run: npm run sim -- 1000
      - name: 生产构建
        run: npm run build